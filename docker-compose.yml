services:
    app:
        build:
            context: ./docker
            dockerfile: Dockerfile
            args:
                WWWUSER: ${WWWUSER}
                WWWGROUP: ${WWWGROUP}
        container_name: portalservidor_app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            - APACHE_DOCUMENT_ROOT=/var/www/html/
            - WWWUSER=${WWWUSER}
            - WWWGROUP=${WWWGROUP}
#            APP_ENV: ${APP_ENV:-local}
#            APP_DEBUG: ${APP_DEBUG:-true}
#            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        entrypoint: /usr/local/bin/entrypoint.sh
        command: apache2-foreground
        volumes:
            - '.:/var/www/html'
            - ./.git:/var/www/html/.git
        networks:
            - transparencia
    redis:
         image: 'redis:alpine'
         container_name: portalservidor_redis
         ports:
             - '${FORWARD_REDIS_PORT:-6379}:6379'
         volumes:
             - 'redis-data:/data'
         networks:
             - transparencia
         healthcheck:
           test: ["CMD", "redis-cli", "ping"]
           retries: 3
           timeout: 5s


networks:
    transparencia:
        external: true
volumes:
    redis-data:
