stages:
  - deploy_wave_1
  - deploy_wave_2
  - deploy_wave_3
  - deploy_wave_4

before_script:
  - 'which ssh-agent'
  - 'eval $(ssh-agent -s)'
  - 'echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'

# Template base (não roda sozinho)
.deploy_template:
  tags:
    - contass-vpn
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - >
      ssh ${SSH_USER}@${SSH_HOST}
      "cd /opt/contass/portal-servidor
      && git checkout .
      && git pull origin main
      && docker compose down
      && docker compose up -d
      ${EXTRA_CMD}"

# -------------------------
# WAVE 1 (5)
# -------------------------
pmserranopolis:
   stage: deploy_wave_1
   extends: .deploy_template
   variables:
     SSH_USER: "contass"
     SSH_HOST: "10.251.0.4"
     EXTRA_CMD: ""
   environment:
     name: production/pmserranopolis
     deployment_tier: production

